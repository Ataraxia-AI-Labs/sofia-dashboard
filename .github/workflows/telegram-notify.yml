# ATARAXIA IA LABS — Telegram Pipeline Notifications (Dashboard)
# Sends real-time notifications to CEO's Telegram for all pipeline events.

name: Telegram Notifications

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, closed, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  pull-requests: read
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build and send notification
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            if (!token || !chatId) return;

            const repo = context.repo.repo;
            const event = context.eventName;
            let msg = '';

            // Helper to escape HTML
            const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

            // ── Issue created/labeled ──
            if (event === 'issues') {
              const issue = context.payload.issue;
              const action = context.payload.action;
              const labels = issue.labels.map(l => l.name).join(', ');

              if (action === 'opened') {
                msg = `📋 <b>Nuevo Issue</b> | <code>${esc(repo)}</code>\n`;
                msg += `<b>#${issue.number}</b>: ${esc(issue.title)}\n`;
                msg += `Labels: <code>${esc(labels || 'none')}</code>\n`;
                msg += `<a href="${issue.html_url}">Ver issue</a>`;
              } else if (action === 'labeled' && context.payload.label?.name === 'auto-heal') {
                msg = `🚨 <b>Auto-Heal Triggered</b> | <code>${esc(repo)}</code>\n`;
                msg += `<b>#${issue.number}</b>: ${esc(issue.title)}\n`;
                msg += `Sentry detecto un error y creo un issue automaticamente.`;
              }
            }

            // ── PR opened/merged/ready ──
            if (event === 'pull_request') {
              const pr = context.payload.pull_request;
              const action = context.payload.action;
              const author = pr.user.login;

              if (action === 'opened') {
                msg = `🔀 <b>Nuevo PR</b> | <code>${esc(repo)}</code>\n`;
                msg += `<b>#${pr.number}</b>: ${esc(pr.title)}\n`;
                msg += `Por: <code>${esc(author)}</code> | +${pr.additions}/-${pr.deletions}\n`;
                msg += `<a href="${pr.html_url}">Ver PR</a>`;
              } else if (action === 'closed' && pr.merged) {
                msg = `✅ <b>PR Mergeado</b> | <code>${esc(repo)}</code>\n`;
                msg += `<b>#${pr.number}</b>: ${esc(pr.title)}\n`;
                msg += `Deploy en progreso...`;
              } else if (action === 'ready_for_review') {
                msg = `👀 <b>PR Ready for Review</b> | <code>${esc(repo)}</code>\n`;
                msg += `<b>#${pr.number}</b>: ${esc(pr.title)}`;
              }
            }

            // ── Review submitted ──
            if (event === 'pull_request_review') {
              const review = context.payload.review;
              const pr = context.payload.pull_request;
              const reviewer = review.user.login;
              const state = review.state;

              if (state === 'approved') {
                msg = `🟢 <b>Review APPROVED</b> | <code>${esc(repo)}</code>\n`;
                msg += `PR <b>#${pr.number}</b> aprobado por <code>${esc(reviewer)}</code>\n`;
                msg += `Auto-merge deberia activarse.`;
              } else if (state === 'changes_requested') {
                msg = `🟡 <b>Changes Requested</b> | <code>${esc(repo)}</code>\n`;
                msg += `PR <b>#${pr.number}</b> | <code>${esc(reviewer)}</code> pide cambios\n`;
                if (reviewer.includes('coderabbit')) {
                  msg += `Copilot iterara automaticamente.`;
                }
              }
            }

            // ── CI completed ──
            if (event === 'check_suite') {
              const cs = context.payload.check_suite;
              if (cs.conclusion === 'failure') {
                const branch = cs.head_branch;
                msg = `❌ <b>CI Failed</b> | <code>${esc(repo)}</code>\n`;
                msg += `Branch: <code>${esc(branch)}</code>\n`;
                msg += `Conclusion: <code>${cs.conclusion}</code>`;
              }
            }

            // Send if we have a message
            if (msg) {
              const url = `https://api.telegram.org/bot${token}/sendMessage`;
              await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  chat_id: chatId,
                  text: msg,
                  parse_mode: 'HTML',
                  disable_web_page_preview: true,
                }),
              });
            }
