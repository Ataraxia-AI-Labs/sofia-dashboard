# ATARAXIA IA LABS — Telegram Pipeline Notifications (Dashboard)
# Sends real-time notifications to CEO's Telegram for all pipeline events.

name: Telegram Notifications

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, closed, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  pull-requests: read
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build and send notification
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            if (!token || !chatId) return;

            const repo = context.repo.repo;
            const event = context.eventName;
            let msg = '';

            // ── Issue created/labeled ──
            if (event === 'issues') {
              const issue = context.payload.issue;
              const action = context.payload.action;
              const labels = issue.labels.map(l => l.name).join(', ');

              if (action === 'opened') {
                msg = `📋 *Nuevo Issue* \\| \`${repo}\`\n`;
                msg += `*#${issue.number}*: ${issue.title}\n`;
                msg += `Labels: \`${labels || 'none'}\`\n`;
                msg += `[Ver issue](${issue.html_url})`;
              } else if (action === 'labeled' && context.payload.label?.name === 'auto-heal') {
                msg = `🚨 *Auto\\-Heal Triggered* \\| \`${repo}\`\n`;
                msg += `*#${issue.number}*: ${issue.title}\n`;
                msg += `Sentry detecto un error y creo un issue automaticamente\\.`;
              }
            }

            // ── PR opened/merged/ready ──
            if (event === 'pull_request') {
              const pr = context.payload.pull_request;
              const action = context.payload.action;
              const author = pr.user.login;

              if (action === 'opened') {
                msg = `🔀 *Nuevo PR* \\| \`${repo}\`\n`;
                msg += `*#${pr.number}*: ${pr.title}\n`;
                msg += `Por: \`${author}\` \\| \\+${pr.additions}/\\-${pr.deletions}\n`;
                msg += `[Ver PR](${pr.html_url})`;
              } else if (action === 'closed' && pr.merged) {
                msg = `✅ *PR Mergeado* \\| \`${repo}\`\n`;
                msg += `*#${pr.number}*: ${pr.title}\n`;
                msg += `Deploy en progreso\\.\\.\\.`;
              } else if (action === 'ready_for_review') {
                msg = `👀 *PR Ready for Review* \\| \`${repo}\`\n`;
                msg += `*#${pr.number}*: ${pr.title}`;
              }
            }

            // ── Review submitted ──
            if (event === 'pull_request_review') {
              const review = context.payload.review;
              const pr = context.payload.pull_request;
              const reviewer = review.user.login;
              const state = review.state;

              if (state === 'approved') {
                msg = `🟢 *Review APPROVED* \\| \`${repo}\`\n`;
                msg += `PR *#${pr.number}* aprobado por \`${reviewer}\`\n`;
                msg += `Auto\\-merge deberia activarse\\.`;
              } else if (state === 'changes_requested') {
                msg = `🟡 *Changes Requested* \\| \`${repo}\`\n`;
                msg += `PR *#${pr.number}* \\| \`${reviewer}\` pide cambios\n`;
                if (reviewer.includes('coderabbit')) {
                  msg += `Copilot iterara automaticamente\\.`;
                }
              }
            }

            // ── CI completed ──
            if (event === 'check_suite') {
              const cs = context.payload.check_suite;
              if (cs.conclusion === 'failure') {
                const branch = cs.head_branch;
                msg = `❌ *CI Failed* \\| \`${repo}\`\n`;
                msg += `Branch: \`${branch}\`\n`;
                msg += `Conclusion: \`${cs.conclusion}\``;
              }
            }

            // Send if we have a message
            if (msg) {
              const url = `https://api.telegram.org/bot${token}/sendMessage`;
              await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  chat_id: chatId,
                  text: msg,
                  parse_mode: 'MarkdownV2',
                  disable_web_page_preview: true,
                }),
              });
            }
