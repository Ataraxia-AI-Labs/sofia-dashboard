# ATARAXIA IA LABS — Copilot Coding Agent Environment Setup (Dashboard)
# This workflow runs BEFORE Copilot starts coding.
# It installs dependencies so the agent can build, lint, and test.

name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify lint works
        run: npm run lint || true

      - name: Verify type check works
        run: npx tsc --noEmit || true

      - name: Verify tests work
        run: npm test -- --ci --passWithNoTests 2>&1 | head -50 || true
