# ATARAXIA IA LABS — Auto-Merge for Approved PRs (Dashboard)
# Same logic as backend. Only auto-merges Copilot PRs or 'auto-merge' labeled PRs.

name: Auto-Merge Approved PRs

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      (github.event.pull_request.user.login == 'copilot[bot]' ||
       contains(github.event.pull_request.labels.*.name, 'auto-merge'))
    steps:
      - name: Check CI status
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });

            const allPassed = checks.check_runs.every(
              run => run.conclusion === 'success' || run.conclusion === 'skipped'
            );

            core.setOutput('passed', allPassed && checks.check_runs.length > 0 ? 'true' : 'false');

      - name: Check reviews
        id: reviews
        if: steps.ci.outputs.passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const approved = reviews.some(r => r.state === 'APPROVED');
            const changesRequested = reviews.some(r => r.state === 'CHANGES_REQUESTED');

            core.setOutput('approved', approved && !changesRequested ? 'true' : 'false');

      - name: Auto-merge
        if: steps.ci.outputs.passed == 'true' && steps.reviews.outputs.approved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
              commit_title: `${context.payload.pull_request.title} (#${context.payload.pull_request.number})`,
              commit_message: 'Auto-merged: CI passed + CodeRabbit approved\n\nCo-Authored-By: GitHub Copilot <copilot@github.com>',
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '**Auto-merged** — CI passed + review approved. Deploying to production via Vercel.',
            });
