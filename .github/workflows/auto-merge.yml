# ATARAXIA IA LABS — Auto-Merge for Copilot PRs (Dashboard)
# Triggers on review submissions and CI completions.
# Uses GitHub API (not event payload) to resolve PR data reliably.
#
# SAFETY: Only auto-merges PRs from Copilot or labeled 'auto-merge'.

name: Auto-Merge Approved PRs

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and check eligibility
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            // ── 1. Find the PR number from the event ──
            let prNumber = null;

            if (context.eventName === 'pull_request_review') {
              prNumber = context.payload.pull_request?.number;
            } else if (context.eventName === 'check_suite') {
              const prs = context.payload.check_suite?.pull_requests;
              if (prs && prs.length > 0) prNumber = prs[0].number;
            }

            if (!prNumber) {
              core.info('No PR associated with this event. Skipping.');
              core.setOutput('eligible', 'false');
              return;
            }

            // ── 2. Fetch full PR data via API ──
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const author = pr.user.login;
            const labels = pr.labels.map(l => l.name);
            const isCopilot = ['Copilot', 'copilot[bot]', 'copilot-swe-agent[bot]'].includes(author);
            const hasAutoMergeLabel = labels.includes('auto-merge');

            core.info(`PR #${prNumber} by "${author}" | Labels: ${labels.join(', ')}`);

            if (!isCopilot && !hasAutoMergeLabel) {
              core.info('Not a Copilot PR and no auto-merge label. Skipping.');
              core.setOutput('eligible', 'false');
              return;
            }

            if (pr.state !== 'open' || pr.draft) {
              core.info('PR is not open or is still draft. Skipping.');
              core.setOutput('eligible', 'false');
              return;
            }

            core.setOutput('eligible', 'true');
            core.setOutput('pr_number', prNumber.toString());
            core.setOutput('pr_sha', pr.head.sha);
            core.setOutput('pr_title', pr.title);

      - name: Check CI status
        id: ci
        if: steps.resolve.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.resolve.outputs.pr_sha }}';
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            // Exclude our own workflow from the check
            const relevant = checks.check_runs.filter(
              r => r.name !== 'auto-merge' && r.name !== 'debug-event'
            );

            const allPassed = relevant.every(
              r => r.conclusion === 'success' || r.conclusion === 'skipped'
            );
            const hasChecks = relevant.length > 0;
            const passed = allPassed && hasChecks;

            core.info(`CI: ${relevant.length} checks, all passed: ${passed}`);
            relevant.forEach(r => core.info(`  ${r.name}: ${r.conclusion}`));
            core.setOutput('passed', passed ? 'true' : 'false');

      - name: Check reviews
        id: reviews
        if: steps.ci.outputs.passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.resolve.outputs.pr_number }}');
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Latest review state per reviewer
            const latestByUser = new Map();
            for (const r of reviews) {
              if (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED') {
                latestByUser.set(r.user.login, r.state);
              }
            }

            // Only human CHANGES_REQUESTED blocks merge. Bot reviews are informational.
            const humanBlocking = [...latestByUser.entries()].some(
              ([user, state]) => state === 'CHANGES_REQUESTED' && !user.endsWith('[bot]')
            );

            // For Copilot PRs: CI pass is enough. No approval required.
            // But if a human explicitly blocked, respect that.
            const canMerge = !humanBlocking;
            core.info(`Reviews: ${JSON.stringify(Object.fromEntries(latestByUser))}`);
            core.info(`Can merge: ${canMerge} (human blocking: ${humanBlocking})`);
            core.setOutput('approved', canMerge ? 'true' : 'false');

      - name: Auto-merge
        if: steps.ci.outputs.passed == 'true' && steps.reviews.outputs.approved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.resolve.outputs.pr_number }}');
            const prTitle = `${{ steps.resolve.outputs.pr_title }}`;

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash',
              commit_title: `${prTitle} (#${prNumber})`,
              commit_message: 'Auto-merged: CI passed + review approved\n\nCo-Authored-By: GitHub Copilot <copilot@github.com>',
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '**Auto-merged** — CI passed + review approved. Deploying to production via Vercel.',
            });

            core.info(`PR #${prNumber} merged successfully!`);
